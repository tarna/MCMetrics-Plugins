name: Build and Release

on:
  push:
    tags:
      - "*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Environment Variables
      run: echo "VERSION=${GITHUB_REF#refs/tag/}" >> $GITHUB_ENV

    - name: Build with Gradle Cache
      uses: burrunan/gradle-cache-action@v3
      with:
        gradle-version: '9.4.0'
        arguments: build

    - name: Publish GitHub Release
      id: github_release
      uses: softprops/action-gh-release@v2
      with:
        files: build/release/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Discord Notification
      uses: appleboy/discord-action@v1.2.0
      with:
        webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        username: "MCMetrics"
        avatar_url: "https://mcmetrics.net/assets/small.png"
        color: "#5a51ef"
        message: |
          New release of MCMetrics has been published: ${{ env.VERSION }}

          Download the release here: ${{ steps.github_release.outputs.url }}